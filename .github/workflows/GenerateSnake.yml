name: GenerateSnake
on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

# Same reason as metrics.yml — snake commits back to main and must
# not race with a concurrent run.
concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-repository:
    name: Update this repo's README with repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            ./img/snake.svg
            ./img/snake-dark.svg?palette=github-dark
          github_token: ${{ secrets.MYTOKEN }}

      - name: Push to GitHub
        uses: EndBug/add-and-commit@v9
        with:
          branch: main  
          message: ':rocket: Update'
