name: GitHub Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

# Serialize runs so a later push cancels an in-flight one and we never
# race two workers on output/metrics.svg (which caused
# "output/metrics.svg does not match <sha>" failures).
concurrency:
  group: metrics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Metrics
        uses: lowlighter/metrics@latest
        with:
          filename: output/metrics.svg

          token: ${{ secrets.MYTOKEN }}

          base: header, activity, community, repositories, metadata

          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_followup: yes
          plugin_followup_indepth: yes
          plugin_achievements: no
